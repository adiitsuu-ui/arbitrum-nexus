[package]
name = "stylus_nexus_contracts"
version = "0.1.0"
edition = "2021"
authors = ["Arbitrum Nexus Team"]
description = "Arbitrum Stylus Smart Contracts: AI Agent Escrow, Vector Verifier & WebAuthn Passkeys"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "export-abi"
path = "src/main.rs"
required-features = ["export-abi"]

[dependencies]
stylus-sdk = "0.10.9"
alloy-sol-types = { version = "=1.7.3", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
stylus-sdk = { version = "0.10.9", features = ["export-abi"] }

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
